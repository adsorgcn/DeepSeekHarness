name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the code-chain gate reads git log since v1.1.52
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: MCP protocol and read-only tool behavior
        run: node --test server/worker.test.mjs
      - name: Agent discovery and browser tools
        run: |
          node tools/test_agent_site.mjs
          node tools/test_webmcp.mjs
      - name: Behavior tests (bot, quotas, book validation)
        run: python -X utf8 tools/test_bot.py
      - name: Behavior tests (free station installer)
        run: python -X utf8 tools/test_free_station.py
      - name: Clipboard helper syntax
        run: |
          bash -n tools/clip_shot.sh
          pwsh -NoProfile -Command "$null=[scriptblock]::Create((Get-Content -Raw tools/clip_shot.ps1)); exit 0"
      - name: Behavior tests (transcribe)
        run: python -X utf8 tools/test_transcribe.py
      - name: Behavior tests (deai skill)
        run: python -X utf8 tools/test_deai.py
      - name: Behavior tests (market)
        run: python -X utf8 tools/test_market.py
      - name: Rubrics R1-R9
        run: python -X utf8 tools/check_rubrics.py
      - name: Brain engine tests
        run: python -X utf8 tools/test_brain.py
      - name: Instruction files identical
        run: python -X utf8 tools/brain.py instructions check
      - name: Brain check
        run: python -X utf8 tools/brain.py check
      - name: code-chain gate (counts since v1.1.52, fails only on an invalid chain)
        run: python -X utf8 tools/code_chain.py check --since v1.1.52
