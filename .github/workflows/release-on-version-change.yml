# Push to main with a new version in CITATION.cff and this tags it and publishes
# the release; the Zenodo webhook on this repository then archives that release
# and mints its DOI. Nothing runs when the version is unchanged, so an ordinary
# commit never creates a release.
#
# Self-healing: the tag and the Release are checked separately. If a previous run
# pushed the tag but failed to create the Release, the next run skips the tag and
# creates the missing Release.
#
# Pre-release lines (tags such as v5.0-pre.x) stay manual: CITATION.cff carries
# the stable version, and this workflow only ever tags that one.

name: Release on version change

on:
  push:
    branches: [main]
    paths: ['CITATION.cff']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the version from CITATION.cff and check tag/release state
        id: read
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version:[[:space:]]*"\{0,1\}\([^"[:space:]]*\)"\{0,1\}.*/\1/p' CITATION.cff | head -1)
          if [ -z "$version" ]; then
            echo "CITATION.cff has no version field" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$(cat "$GITHUB_OUTPUT" | grep '^tag_exists=' | cut -d= -f2)" = "true" ] && \
             [ "$(cat "$GITHUB_OUTPUT" | grep '^release_exists=' | cut -d= -f2)" = "true" ]; then
            echo "v$version tag and release both exist; nothing to do"
          fi

      - name: Tag (when missing)
        if: steps.read.outputs.tag_exists == 'false'
        env:
          VERSION: ${{ steps.read.outputs.version }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "$REPO_NAME $VERSION"
          git push origin "v$VERSION"
          echo "tagged v$VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release (when missing; self-heals after a partial failure)
        if: steps.read.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.read.outputs.version }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          gh release create "v$VERSION" --verify-tag --latest --generate-notes --title "$REPO_NAME $VERSION"
          echo "released v$VERSION; Zenodo archives it from the release webhook" >> "$GITHUB_STEP_SUMMARY"
          gitee_head=$(curl -s --max-time 20 https://gitee.com/api/v5/repos/monetize/DeepSeekHarness/branches/main | sed -n 's/.*"sha":"\([0-9a-f]*\)".*/\1/p')
          echo "GitHub main HEAD: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Gitee  main HEAD: ${gitee_head:-unavailable}" >> "$GITHUB_STEP_SUMMARY"
