name: Upstream Sync

on:
  schedule:
    - cron: '0 8 * * 1'  # Weekly Monday 8am UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream
        run: git remote add upstream https://github.com/ilang-ai/mem-forever.git || true

      - name: Fetch upstream
        run: git fetch upstream main

      - name: Sync engine files only
        run: |
          # Only sync engine files; never touch user data in soul/ memory/ handoff/ vault/ env/ (or the deprecated .ilang/).
          # The five instruction files and LICENSE stay local: kept identical to upstream by discipline, and this
          # repo's DSH additions live in AGENTS.local.md, which upstream does not sync.
          # The .dsh skill copy mirrors skills/mem-forever/SKILL.md so DSH skill discovery and the canonical
          # source never drift apart (they are byte-identical as of v1.0.9).
          git checkout upstream/main -- tools/brain.py rules/GRAMMAR-CARD.md rules/GRAMMAR-CARD.zh.md docs/OKF.md docs/VAULT.md skills/mem-forever/SKILL.md .dsh/skills/mem-forever/SKILL.md
          
          # Check if anything changed
          if git diff --staged --quiet; then
            echo "Already up to date."
          else
            echo "upstream changes staged; the regression gate runs next"
          fi

      - name: Regression gate
        run: |
          if git diff --staged --quiet; then
            echo "no upstream changes; gate skipped"
            exit 0
          fi
          python -X utf8 tools/brain.py check
          python -X utf8 tools/check_rubrics.py
          python -X utf8 tools/test_bot.py

      - name: Commit and push
        run: |
          if git diff --staged --quiet; then
            echo "nothing staged; nothing to push"
            exit 0
          fi
          git config user.name "mem-forever[bot]"
          git config user.email "bot@ilang.ai"
          git commit -m "sync: upstream engine update $(date +%Y-%m-%d)"
          git push
