name: Upstream Sync

on:
  schedule:
    - cron: '0 8 * * 1'  # Weekly Monday 8am UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream
        run: git remote add upstream https://github.com/ilang-ai/mem-forever.git || true

      - name: Fetch upstream
        run: git fetch upstream main

      - name: Sync engine files only
        run: |
          # Only sync engine files; never touch user data in soul/ memory/ handoff/ vault/ env/ log/ pair/
          # (or the deprecated .ilang/). The five instruction files are regenerated from SKILL.md by
          # `brain.py instructions sync`; the .dsh skill copy is obtained by cp; MARKET.md and the
          # registry rows are refreshed by tools/market_build.py. The .dsh path does not exist
          # upstream, so it must not appear on the checkout line (it would fail the whole command).
          git checkout upstream/main -- tools/brain.py rules/GRAMMAR-CARD.md rules/GRAMMAR-CARD.zh.md docs/OKF.md docs/VAULT.md docs/LEDGER.md docs/PRODUCT.md skills/mem-forever/SKILL.md tools/hooks/pre-commit tools/hooks/pre-push tools/test_brain.py env/README.md
          cp skills/mem-forever/SKILL.md .dsh/skills/mem-forever/SKILL.md
          python -X utf8 tools/brain.py instructions sync
          python -X utf8 tools/market_build.py
          git add -A -- .dsh/skills/mem-forever *.md .cursorrules .github/copilot-instructions.md docs/market

          # Check if anything changed
          if git diff --staged --quiet; then
            echo "Already up to date."
          else
            echo "upstream changes staged; the regression gate runs next"
          fi

      - name: Regression gate
        run: |
          if git diff --staged --quiet; then
            echo "no upstream changes; gate skipped"
            exit 0
          fi
          python -X utf8 tools/brain.py check
          python -X utf8 tools/brain.py instructions check
          python -X utf8 tools/test_brain.py
          python -X utf8 tools/test_market.py
          python -X utf8 tools/check_rubrics.py
          python -X utf8 tools/test_bot.py

      - name: Commit and push
        run: |
          if git diff --staged --quiet; then
            echo "nothing staged; nothing to push"
            exit 0
          fi
          git config user.name "mem-forever[bot]"
          git config user.email "bot@ilang.ai"
          git commit -m "sync: upstream engine update $(date +%Y-%m-%d)"
          git push
